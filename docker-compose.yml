services:
  app:
    build:
      context: .
      target: runtime
    image: gateway-comunicacao:0.1.0
    env_file: .env
    environment:
      # 4 barras = caminho absoluto dentro do container
      DATABASE_URL: sqlite+aiosqlite:////app/data/gateway.db
    ports:
      - "127.0.0.1:8001:8000"   # só acessível na própria máquina
    volumes:
      - ./config:/app/config:ro
      - gateway_data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    restart: unless-stopped

volumes:
  gateway_data: