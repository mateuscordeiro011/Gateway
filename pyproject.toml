[project]
name = "gateway-comunicacao"
version = "0.1.0"
description = "Gateway de comunicacao WhatsApp/Outlook para sistema central de atendimento"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.9.0",
    "msal>=1.39.0",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "python-json-logger>=2.0.7",
]
optional-dependencies = {dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.23.0",
    "ruff>=0.16.0",
]}

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["config*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # Depends in argument defaults - FastAPI standard pattern
    "B009",  # Mutable default argument
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=65"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*"]